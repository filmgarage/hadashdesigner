<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HADashDesigner</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; background: #f5f5f5; color: #222; }
    aside { width: 250px; border-right: 1px solid #ddd; padding: 10px; background: #fff; display: flex; flex-direction: column; gap: 6px; box-sizing: border-box; }
    #palette { flex: 1; overflow: auto; }
    .pitem { display: block; width: 100%; text-align: left; padding: 4px 6px; margin: 2px 0; font-size: 13px; cursor: pointer; }
    main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .bar { display: flex; gap: 8px; align-items: center; padding: 8px; background: #fff; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
    #canvas { flex: 1; overflow: auto; padding: 10px; box-sizing: border-box; }
    .grid-stack { background: #e4e4e4; min-height: 300px; border-radius: 8px; }
    .tile { background: #2a2a2a; color: #eee; border-radius: 12px; height: 100%; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
    .tile b { font-size: 14px; }
    .tile small { opacity: .7; font-size: 11px; word-break: break-all; }
    .tile .rm { align-self: flex-end; background: none; border: 0; color: #f88; font-size: 16px; cursor: pointer; padding: 0; }
    #yaml { height: 160px; font-family: monospace; font-size: 12px; border-top: 1px solid #ddd; padding: 8px; box-sizing: border-box; width: 100%; background: #fff; }
    #status { font-size: 14px; }
  </style>
</head>
<body>
  <aside>
    <input id="filter" placeholder="Zoek entiteit">
    <div id="palette"></div>
  </aside>
  <main>
    <div class="bar">
      <select id="dashes"></select>
      <input id="name" placeholder="naam.dash">
      <input id="title" placeholder="Titel">
      <button id="new">Nieuw</button>
      <button id="save">Opslaan</button>
      <span id="status"></span>
    </div>
    <div id="canvas"><div class="grid-stack"></div></div>
    <textarea id="yaml" readonly></textarea>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let entities = [];
    let names = {};
    let loaded = {};
    let grid;

    function status(msg, ok = true) {
      $('status').textContent = msg;
      $('status').style.color = ok ? '#0a7a2f' : '#b00020';
    }

    async function safe(fn) {
      try { await fn(); } catch (e) { status(e.message, false); }
    }

    async function api(path, opts) {
      const r = await fetch(path, opts);
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'fout ' + r.status);
      return data;
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function tileHtml(entity) {
      const label = names[entity] || entity;
      return `<div class="tile"><button class="rm" title="Verwijderen">×</button><b>${esc(label)}</b><small>${esc(entity)}</small></div>`;
    }

    // ---------- Grid ----------

    function initGrid() {
      grid = GridStack.init({
        column: 12,
        cellHeight: 90,
        margin: 6,
        float: false,
        minRow: 1,
        resizable: { handles: 'e, w' }, // alleen breedte: HADashboard werkt met rijen
      }, '.grid-stack');

      grid.on('change added removed', updateYaml);

      grid.el.addEventListener('click', (e) => {
        if (e.target.classList.contains('rm')) {
          grid.removeWidget(e.target.closest('.grid-stack-item'));
        }
      });
    }

    function addTile(entity, x, y, w = 2) {
      const opts = { w, h: 1, minH: 1, maxH: 1, content: tileHtml(entity) };
      if (x === undefined) {
        opts.autoPosition = true;
      } else {
        opts.x = x;
        opts.y = y;
      }
      grid.addWidget(opts);
      updateYaml();
    }

    function gridItems() {
      return grid.getGridItems()
        .map((el) => {
          const n = el.gridstackNode;
          const t = el.querySelector('.tile');
          return { entity: t ? t.dataset.entity : null, x: n.x, y: n.y, w: n.w };
        })
        .filter((i) => i.entity)
        .sort((a, b) => a.y - b.y || a.x - b.x);
    }

    // ---------- Grid <-> layout ----------

    function buildLayout() {
      const byRow = new Map();
      for (const i of gridItems()) {
        if (!byRow.has(i.y)) byRow.set(i.y, []);
        byRow.get(i.y).push(i);
      }
      const rows = [];
      let cursor = 0;
      const ys = [...byRow.keys()].sort((a, b) => a - b);
      for (const y of ys) {
        while (cursor < y) { rows.push({ empty: 1 }); cursor++; }
        rows.push(byRow.get(y).map((i) => i.entity + (i.w > 1 ? `(${i.w}x1)` : '')).join(', '));
        cursor++;
      }
      return rows;
    }

    function buildYaml() {
      const doc = { ...loaded };
      const title = $('title').value.trim();
      if (title) doc.title = title; else delete doc.title;
      doc.layout = buildLayout();
      return jsyaml.dump(doc, { lineWidth: -1 });
    }

    function updateYaml() {
      $('yaml').value = buildYaml();
    }

    function loadYaml(text) {
      const doc = jsyaml.load(text) || {};
      const { layout = [], ...rest } = doc;
      loaded = rest;
      $('title').value = rest.title || '';
      grid.removeAll();

      const skipped = [];
      let y = 0;
      for (const row of layout) {
        if (typeof row === 'string') {
          let x = 0;
          for (const token of row.split(',').map((s) => s.trim()).filter(Boolean)) {
            const m = token.match(/^([a-z_]+\.[a-z0-9_]+)(?:\((\d+)x\d+\))?$/);
            if (!m) { skipped.push(token); continue; }
            const w = m[2] ? Number(m[2]) : 1;
            addTile(m[1], x, y, w);
            x += w;
          }
        }
        y += (row && row.empty) ? Number(row.empty) : 1;
      }
      updateYaml();
      if (skipped.length) status('Overgeslagen (nog niet ondersteund): ' + skipped.join(', '), false);
    }

    // ---------- Data ----------

    async function loadEntities() {
      entities = await api('api/entities');
      names = Object.fromEntries(entities.map((e) => [e.entity_id, e.name]));
      renderPalette();
    }

    function renderPalette() {
      const q = $('filter').value.toLowerCase();
      const pal = $('palette');
      pal.innerHTML = '';
      const matches = entities.filter((e) => (e.entity_id + ' ' + e.name).toLowerCase().includes(q));
      for (const e of matches.slice(0, 300)) {
        const b = document.createElement('button');
        b.className = 'pitem';
        b.textContent = e.name;
        b.title = e.entity_id;
        b.onclick = () => addTile(e.entity_id);
        pal.appendChild(b);
      }
    }

    async function loadList(selected) {
      const items = await api('api/dashboards');
      const sel = $('dashes');
      sel.innerHTML = '<option value="">— kies een dashboard —</option>';
      for (const it of items) {
        const o = document.createElement('option');
        o.value = it.name;
        o.textContent = it.name;
        sel.appendChild(o);
      }
      if (selected) sel.value = selected;
    }

    async function open(name) {
      const d = await api('api/dashboards/' + encodeURIComponent(name));
      $('name').value = name;
      loadYaml(d.content);
      status('Geladen: ' + name);
    }

    async function save() {
      let name = $('name').value.trim();
      if (!name) return status('Vul een naam in', false);
      if (!name.endsWith('.dash')) name += '.dash';
      $('name').value = name;
      await api('api/dashboards/' + encodeURIComponent(name), {
        method: 'PUT',
        headers: { 'Content-Type': 'text/plain' },
        body: buildYaml(),
      });
      await loadList(name);
      status('Opgeslagen: ' + name);
    }

    function newDashboard() {
      loaded = {};
      $('name').value = '';
      $('title').value = '';
      $('dashes').value = '';
      grid.removeAll();
      updateYaml();
      status('Nieuw dashboard: voeg tegels toe en sla op');
    }

    // ---------- Start ----------

    $('filter').oninput = renderPalette;
    $('title').oninput = updateYaml;
    $('save').onclick = () => safe(save);
    $('new').onclick = newDashboard;
    $('dashes').onchange = (e) => e.target.value && safe(() => open(e.target.value));

    initGrid();
    Promise.all([loadEntities(), loadList()]).catch((e) => status(e.message, false));
  </script>
</body>
</html>
