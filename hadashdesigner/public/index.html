<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HADashDesigner</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css">
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; height: 100vh; display: flex; background: #f0f0f0; color: #222; }
    .left { width: 200px; background: #fff; border-right: 1px solid #ddd; padding: 10px; overflow: auto; }
    .left h3, #props h3 { margin: 4px 0 10px; font-size: 15px; }
    .pitem { display: block; width: 100%; text-align: left; padding: 6px 8px; margin: 3px 0; font-size: 13px; cursor: pointer; }
    main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    header { display: flex; gap: 8px; align-items: center; padding: 8px; background: #fff; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
    header input { width: 160px; }
    #status { font-size: 14px; }
    #ha { margin-left: auto; font-size: 13px; }
    .tabs { display: flex; background: #fff; border-bottom: 1px solid #ddd; }
    .tab { padding: 8px 16px; border: 0; background: none; cursor: pointer; font-size: 14px; border-bottom: 3px solid transparent; }
    .tab.active { border-bottom-color: #d49a1c; font-weight: 600; }
    #warn { background: #fff3cd; padding: 8px 10px; font-size: 13px; border-bottom: 1px solid #ffe08a; }
    #view-design { flex: 1; overflow: auto; padding: 10px; }
    #view-yaml { flex: 1; display: flex; }
    #yamlbox { flex: 1; font-family: monospace; font-size: 13px; border: 0; padding: 10px; resize: none; }
    #view-result { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    #resinfo { font-size: 13px; padding: 6px 10px; background: #fff; border-bottom: 1px solid #ddd; }
    #frame { flex: 1; border: 0; width: 100%; background: #111; }
    .grid-stack { background: #e2e2e2; border-radius: 8px; min-height: 300px; }
    .tile { background: #2a2a2a; color: #eee; border-radius: 12px; height: 100%; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; cursor: pointer; }
    .tile.empty { background: #6a6a6a; }
    .tile.sel { outline: 3px solid #d49a1c; }
    .tile b { font-size: 14px; }
    .tile small { opacity: .7; font-size: 11px; word-break: break-all; }
    .tile em { font-style: normal; font-size: 13px; color: #ffd27a; }
    .tile .rm { align-self: flex-end; background: none; border: 0; color: #f88; font-size: 16px; cursor: pointer; padding: 0; }
    #props { width: 300px; background: #fff; border-left: 1px solid #ddd; padding: 10px; overflow: auto; }
    #props label { display: block; font-size: 13px; margin: 10px 0; }
    #props input, #props select { width: 100%; padding: 4px; margin-top: 3px; }
    .elist { max-height: 200px; overflow: auto; border: 1px solid #eee; margin-top: 4px; }
    .elist .pitem { font-size: 12px; margin: 0; border-bottom: 1px solid #f2f2f2; }
    .muted { color: #777; font-size: 12px; }
    .actions { font-size: 12px; color: #555; word-break: break-word; }
  </style>
</head>
<body>
  <aside class="left">
    <h3>Widgets</h3>
    <div id="palette"></div>
  </aside>

  <main>
    <header>
      <select id="dashes"></select>
      <input id="name" placeholder="naam.dash">
      <button id="new">Nieuw</button>
      <button id="save">Opslaan</button>
      <button id="undo" title="Ctrl+Z">Ongedaan</button>
      <button id="redo" title="Ctrl+Y">Opnieuw</button>
      <span id="status"></span>
      <span id="ha"></span>
    </header>
    <div class="tabs">
      <button class="tab active" data-tab="design">Ontwerp</button>
      <button class="tab" data-tab="yaml">YAML</button>
      <button class="tab" data-tab="result">Resultaat</button>
    </div>
    <div id="warn" hidden>Dit dashboard gebruikt <b>include</b>-verwijzingen. De editor kan dat nog niet bewerken, dus opslaan is uitgeschakeld. Bewerk het bestand in de YAML-tab of op de server.</div>
    <div id="view-design"><div class="grid-stack"></div></div>
    <div id="view-yaml" hidden><textarea id="yamlbox" spellcheck="false"></textarea></div>
    <div id="view-result" hidden>
      <div id="resinfo"></div>
      <iframe id="frame"></iframe>
    </div>
  </main>

  <aside id="props"></aside>

  <script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    // Het widgetpalet komt uit catalog.json (server), niet uit een lijst in deze pagina
    let TYPES = {};

    let entities = [];
    let names = {};
    let live = {};          // entity -> { state, unit, name }
    let loaded = {};        // overige bestandsinhoud, behalve layout en tegels
    let dashTitle = '';
    let props = {};         // tegel-id -> eigenschappen (zie newProps)
    let nextId = 1;
    let selectedId = null;
    let grid;
    let currentTab = 'design';
    let readOnly = false;
    let settings = { cols: 12, rows: 6, cellw: 120, cellh: 90 };
    let appdaemonPort = 5050;
    let haOnline = false;
    const undoStack = [];
    const redoStack = [];

    function status(msg, ok = true) {
      $('status').textContent = msg;
      $('status').style.color = ok ? '#0a7a2f' : '#b00020';
    }

    async function safe(fn) {
      try { await fn(); } catch (e) { status(e.message, false); }
    }

    async function api(path, opts) {
      const r = await fetch(path, opts);
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'fout ' + r.status);
      return data;
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function clamp(v, min, max, def) {
      const n = Number(v);
      if (!Number.isFinite(n)) return def;
      return Math.min(max, Math.max(min, Math.round(n)));
    }

    // ---------- Typen uit de catalogus ----------

    function typeInfo(type) {
      return TYPES[type] || { name: type, entity: true, domains: [], fields: [], width: 1 };
    }
    const hasEntity = (type) => typeInfo(type).entity !== false;
    const hasField = (type, field) => (typeInfo(type).fields || []).includes(field);

    function newProps(type, entity = '', w = 2) {
      return { type, entity, title: '', title2: '', units: '', precision: '', url: '', dashboard: '', text: '', w, raw: {} };
    }

    // Leest een widgetdefinitie uit het bestand; onbekende sleutels blijven bewaard
    function fromDef(d) {
      const p = newProps(d.widget_type, d.entity || '', 1);
      p.title = d.title ?? '';
      p.title2 = d.title2 ?? '';
      p.units = d.units ?? '';
      p.precision = d.precision ?? '';
      p.url = d.url ?? '';
      p.dashboard = d.dashboard ?? '';
      p.text = d.text ?? '';
      const raw = { ...d };
      for (const k of ['widget_type', 'entity', 'title', 'title2', 'units', 'precision', 'url', 'dashboard', 'text']) delete raw[k];
      p.raw = raw;
      return p;
    }

    // ---------- Ongedaan maken ----------

    function checkpoint() {
      const snap = buildYaml();
      if (undoStack.length && undoStack[undoStack.length - 1] === snap) return;
      undoStack.push(snap);
      if (undoStack.length > 100) undoStack.shift();
      redoStack.length = 0;
    }

    function undo() {
      if (!undoStack.length) return status('Niets om ongedaan te maken', false);
      redoStack.push(buildYaml());
      loadYaml(undoStack.pop());
      status('Ongedaan gemaakt');
    }

    function redo() {
      if (!redoStack.length) return status('Niets om opnieuw uit te voeren', false);
      undoStack.push(buildYaml());
      loadYaml(redoStack.pop());
      status('Opnieuw uitgevoerd');
    }

    // ---------- Tegels ----------

    function tileHtml(id) {
      const p = props[id];
      const t = typeInfo(p.type);
      const title = p.title || (p.entity && names[p.entity]) || t.name;
      const sub = hasEntity(p.type) ? (p.entity || '(kies entiteit)') : (p.url || p.dashboard || p.text || t.name);
      const cls = ['tile',
        id === selectedId ? 'sel' : '',
        (hasEntity(p.type) && !p.entity) ? 'empty' : ''].join(' ');
      const value = p.entity && live[p.entity]
        ? `${live[p.entity].state}${live[p.entity].unit ? ' ' + live[p.entity].unit : ''}`
        : '';
      return `<div class="${cls}" data-id="${id}"><button class="rm" title="Verwijderen">×</button><b>${esc(title)}</b><small>${esc(sub)}</small><em data-live="${esc(p.entity)}">${esc(value)}</em></div>`;
    }

    function tileEl(id) {
      const t = document.querySelector(`.tile[data-id="${id}"]`);
      return t ? t.closest('.grid-stack-item') : null;
    }

    function refreshTile(id) {
      const item = tileEl(id);
      if (item) item.querySelector('.grid-stack-item-content').innerHTML = tileHtml(id);
    }

    function addWidget(type, entity = '', x, y) {
      checkpoint();
      const id = 'tile_' + nextId++;
      const w = typeInfo(type).width || 2;
      props[id] = newProps(type, entity, w);
      const opts = { w, h: 1, minH: 1, maxH: 1, content: tileHtml(id) };
      if (x === undefined) {
        opts.autoPosition = true;
      } else {
        opts.x = x;
        opts.y = y;
      }
      grid.addWidget(opts);
      select(id);
      return id;
    }

    function removeTile(id) {
      const item = tileEl(id);
      if (selectedId === id) selectedId = null;
      delete props[id];
      if (item) grid.removeWidget(item);
      renderProps();
    }

    function select(id) {
      selectedId = id;
      document.querySelectorAll('.tile').forEach((t) => t.classList.toggle('sel', t.dataset.id === id));
      renderProps();
    }

    // Leest posities uit het raster en synchroniseert de breedte
    function gridItems() {
      return grid.getGridItems()
        .map((el) => {
          const n = el.gridstackNode;
          const t = el.querySelector('.tile');
          if (!t) return null;
          const id = t.dataset.id;
          if (props[id]) props[id].w = n.w;
          return { id, x: n.x, y: n.y, w: n.w };
        })
        .filter(Boolean)
        .sort((a, b) => a.y - b.y || a.x - b.x);
    }

    function initGrid() {
      grid = GridStack.init({
        column: settings.cols,
        cellHeight: settings.cellh,
        margin: 5,
        float: false,
        minRow: 1,
        resizable: { handles: 'e, w' },
      }, '.grid-stack');

      grid.on('dragstart resizestart', () => checkpoint());
      grid.on('change added removed', () => { if (selectedId && props[selectedId]) renderProps(); });

      grid.el.addEventListener('click', (e) => {
        if (e.target.classList.contains('rm')) {
          const t = e.target.closest('.grid-stack-item').querySelector('.tile');
          checkpoint();
          removeTile(t.dataset.id);
          return;
        }
        const t = e.target.closest('.tile');
        if (t) select(t.dataset.id);
      });
    }

    function applySettings() {
      grid.column(settings.cols, 'moveScale');
      grid.cellHeight(settings.cellh);
      document.querySelector('.grid-stack').style.minHeight = (settings.rows * (settings.cellh + 5)) + 'px';
    }

    // ---------- YAML <-> raster ----------

    function buildYaml() {
      const rest = { ...loaded };
      for (const k of ['title', 'widget_dimensions', 'widget_margins', 'columns', 'rows', 'layout']) delete rest[k];
      for (const k of Object.keys(rest)) if (/^tile_\d+$/.test(k)) delete rest[k];

      const doc = {};
      if (dashTitle) doc.title = dashTitle;
      doc.widget_dimensions = [settings.cellw, settings.cellh];
      doc.widget_margins = Array.isArray(loaded.widget_margins) ? loaded.widget_margins : [5, 5];
      doc.columns = settings.cols;
      doc.rows = settings.rows;
      Object.assign(doc, rest);

      const items = gridItems();
      const byRow = new Map();
      for (const i of items) {
        if (!byRow.has(i.y)) byRow.set(i.y, []);
        byRow.get(i.y).push(i);
      }
      const layout = [];
      let cursor = 0;
      for (const y of [...byRow.keys()].sort((a, b) => a - b)) {
        while (cursor < y) { layout.push({ empty: 1 }); cursor++; }
        layout.push(byRow.get(y).map((i) => i.id + (i.w > 1 ? `(${i.w}x1)` : '')).join(', '));
        cursor++;
      }

      for (const i of items) {
        const p = props[i.id];
        const def = { widget_type: p.type };
        if (hasEntity(p.type) && p.entity) def.entity = p.entity;
        if (p.title) def.title = p.title;
        if (p.title2) def.title2 = p.title2;
        if (p.units) def.units = p.units;
        if (p.precision !== '' && p.precision !== null && p.precision !== undefined) def.precision = Number(p.precision);
        if (p.url) def.url = p.url;
        if (p.dashboard) def.dashboard = p.dashboard;
        if (p.text) def.text = p.text;
        Object.assign(def, p.raw);
        doc[i.id] = def;
      }
      doc.layout = layout;
      return jsyaml.dump(doc, { lineWidth: -1 });
    }

    function loadYaml(text) {
      const doc = jsyaml.load(text) || {};
      const layout = Array.isArray(doc.layout) ? doc.layout : [];

      // Namen die in de layout voorkomen worden tegels; de rest blijft bewaard
      const used = new Set();
      for (const row of layout) {
        if (typeof row !== 'string') continue;
        for (const tok of row.split(',')) {
          const m = tok.trim().match(/^([A-Za-z0-9_.]+)/);
          if (m) used.add(m[1]);
        }
      }
      const rest = { ...doc };
      for (const k of ['layout', 'title', 'widget_dimensions', 'widget_margins', 'columns', 'rows']) delete rest[k];
      for (const k of Object.keys(rest)) if (used.has(k) || /^tile_\d+$/.test(k)) delete rest[k];
      loaded = rest;
      loaded.widget_margins = doc.widget_margins;
      dashTitle = typeof doc.title === 'string' ? doc.title : '';

      if (Array.isArray(doc.widget_dimensions)) {
        settings.cellw = clamp(doc.widget_dimensions[0], 40, 400, settings.cellw);
        settings.cellh = clamp(doc.widget_dimensions[1], 40, 400, settings.cellh);
      }
      settings.cols = clamp(doc.columns, 1, 32, settings.cols);
      settings.rows = clamp(doc.rows, 1, 30, settings.rows);
      applySettings();

      nextId = 1;
      for (const k of Object.keys(doc)) {
        const m = k.match(/^tile_(\d+)$/);
        if (m) nextId = Math.max(nextId, Number(m[1]) + 1);
      }

      readOnly = layout.some((r) => r && typeof r === 'object' && r.include !== undefined);
      $('warn').hidden = !readOnly;

      grid.removeAll();
      props = {};
      selectedId = null;

      const skipped = [];
      let y = 0;
      for (const row of layout) {
        if (typeof row === 'string') {
          let x = 0;
          for (const token of row.split(',').map((s) => s.trim()).filter(Boolean)) {
            const m = token.match(/^([A-Za-z0-9_.]+)(?:\((\d+)x\d+\))?$/);
            if (!m) { skipped.push(token); continue; }
            const name = m[1];
            const w = m[2] ? Number(m[2]) : 1;
            if (name === 'spacer') { x += w; continue; }

            const src = doc[name] && typeof doc[name] === 'object' && doc[name].widget_type ? doc[name] : null;
            const isEntity = ENTITY_OK.test(name);
            if (!src && !isEntity) { skipped.push(name); continue; }

            let id = src ? name : 'tile_' + nextId++;
            if (props[id]) id = 'tile_' + nextId++;   // zelfde naam twee keer in de layout
            const p = src ? fromDef(src) : newProps(name.split('.')[0], name, w);
            p.w = w;
            props[id] = p;
            grid.addWidget({ x, y, w, h: 1, minH: 1, maxH: 1, content: tileHtml(id) });
            x += w;
          }
        }
        y += (row && typeof row === 'object' && row.empty) ? Number(row.empty) : 1;
      }
      renderProps();
      if (skipped.length) status('Overgeslagen (nog niet ondersteund): ' + skipped.join(', '), false);
    }

    const ENTITY_OK = /^[a-z_]+\.[a-z0-9_]+$/;

    // ---------- Eigenschappen ----------

    function renderProps() {
      if (!selectedId || !props[selectedId]) return renderDashProps();
      const p = props[selectedId];
      const item = tileEl(selectedId);
      const pos = item ? item.gridstackNode : { x: 0, y: 0 };
      const typeOpts = Object.entries(TYPES)
        .map(([k, v]) => `<option value="${k}" ${k === p.type ? 'selected' : ''}>${v.name}</option>`).join('');
      const extraKeys = Object.keys(p.raw || {});

      $('props').innerHTML = `
        <h3>Tegel <span class="muted">${esc(selectedId)}</span></h3>
        <label>Type<select id="ptype">${typeOpts}</select></label>
        ${hasEntity(p.type) ? `
          <label>Entiteit<input id="pentity" value="${esc(p.entity)}" placeholder="zoek of kies uit de lijst" autocomplete="off"></label>
          <div id="elist" class="elist"></div>
          <div id="pactions" class="actions"></div>` : ''}
        <label>Titel<input id="ptitle" value="${esc(p.title)}" placeholder="standaard: naam van de entiteit"></label>
        <label>Subtitel (title2)<input id="ptitle2" value="${esc(p.title2)}"></label>
        ${hasField(p.type, 'units') ? `<label>Eenheid<input id="punits" value="${esc(p.units)}" placeholder="°C, %, lux"></label>` : ''}
        ${hasField(p.type, 'precision') ? `<label>Decimalen<input id="pprec" type="number" min="0" max="5" value="${esc(p.precision)}"></label>` : ''}
        ${hasField(p.type, 'text') ? `<label>Tekst<input id="ptext" value="${esc(p.text)}"></label>` : ''}
        ${hasField(p.type, 'url') ? `<label>Url<input id="purl" value="${esc(p.url)}" placeholder="bijv. /MainPanel"></label>` : ''}
        ${hasField(p.type, 'dashboard') ? `<label>Dashboard (naam zonder .dash)<input id="pdash" value="${esc(p.dashboard)}"></label>` : ''}
        <label>Breedte (kolommen)<input id="pw" type="number" min="1" max="${settings.cols}" value="${p.w}"></label>
        <p class="muted">Positie: rij ${pos.y + 1}, kolom ${pos.x + 1}</p>
        ${extraKeys.length ? `<p class="muted">Ook in het bestand: ${esc(extraKeys.join(', '))}</p>` : ''}
        <button id="pdel">Tegel verwijderen</button>`;

      $('ptype').onchange = (e) => {
        checkpoint();
        p.type = e.target.value;
        refreshTile(selectedId);
        renderProps();
      };
      if ($('pentity')) {
        $('pentity').onfocus = () => { checkpoint(); renderEntityList(); };
        $('pentity').oninput = renderEntityList;
        $('pentity').onchange = (e) => setEntity(e.target.value.trim());
        renderEntityList();
        showActions(p.entity);
      }
      bindText('ptitle', 'title');
      bindText('ptitle2', 'title2');
      bindText('punits', 'units');
      bindText('pprec', 'precision');
      bindText('ptext', 'text');
      bindText('purl', 'url');
      bindText('pdash', 'dashboard');
      $('pw').onfocus = () => checkpoint();
      $('pw').onchange = (e) => setWidth(clamp(e.target.value, 1, settings.cols, p.w));
      $('pdel').onclick = () => { checkpoint(); removeTile(selectedId); };
    }

    function bindText(id, key) {
      const el = $(id);
      if (!el) return;
      el.onfocus = () => checkpoint();
      el.oninput = (e) => {
        props[selectedId][key] = e.target.value;
        refreshTile(selectedId);
      };
    }

    function renderEntityList() {
      const p = props[selectedId];
      if (!p || !$('elist')) return;
      const domains = typeInfo(p.type).domains || [];
      const q = $('pentity').value.toLowerCase();
      const list = entities
        .filter((e) => (!domains.length || domains.includes(e.entity_id.split('.')[0]))
          && (e.entity_id + ' ' + e.name).toLowerCase().includes(q))
        .slice(0, 80);
      const box = $('elist');
      box.innerHTML = '';
      if (!list.length) { box.textContent = entities.length ? 'Geen entiteiten gevonden' : 'Geen entiteiten (Home Assistant offline?)'; return; }
      for (const e of list) {
        const b = document.createElement('button');
        b.className = 'pitem';
        b.textContent = `${e.name} · ${e.entity_id}`;
        b.onclick = () => { $('pentity').value = e.entity_id; setEntity(e.entity_id); };
        box.appendChild(b);
      }
    }

    // Toont wat Home Assistant voor deze entiteit aanbiedt (zo blijven we niet aan een vaste lijst vastzitten)
    async function showActions(entity) {
      const box = $('pactions');
      if (!box || !entity) return;
      box.textContent = '';
      try {
        const r = await api('api/actions?entity=' + encodeURIComponent(entity));
        if (!box.isConnected || props[selectedId]?.entity !== entity) return;
        box.textContent = r.actions.length
          ? 'Acties in Home Assistant: ' + r.actions.join(', ')
          : 'Home Assistant meldt geen acties voor deze entiteit.';
      } catch (e) {
        box.textContent = 'Acties niet beschikbaar: ' + e.message;
      }
    }

    function setEntity(entity) {
      if (!selectedId) return;
      checkpoint();
      props[selectedId].entity = entity;
      refreshTile(selectedId);
      showActions(entity);
    }

    function setWidth(w) {
      if (!selectedId) return;
      const item = tileEl(selectedId);
      if (item) grid.update(item, { w });
      props[selectedId].w = w;
      refreshTile(selectedId);
    }

    function renderDashProps() {
      $('props').innerHTML = `
        <h3>Dashboard</h3>
        <label>Titel<input id="dtitle" value="${esc(dashTitle)}"></label>
        <label>Kolommen (columns)<input id="dcols" type="number" min="1" max="32" value="${settings.cols}"></label>
        <label>Rijen (rows)<input id="drows" type="number" min="1" max="30" value="${settings.rows}"></label>
        <label>Celbreedte px (widget_dimensions)<input id="dcellw" type="number" min="40" max="400" value="${settings.cellw}"></label>
        <label>Celhoogte px (widget_dimensions)<input id="dcellh" type="number" min="40" max="400" value="${settings.cellh}"></label>
        <label>HADashboard-poort<input type="number" value="${appdaemonPort}" disabled></label>
        <p class="muted">Klik op een tegel om zijn eigenschappen te zien en te wijzigen. Delete verwijdert de gekozen tegel, pijltjes verplaatsen hem, Shift+pijl verandert de breedte.</p>`;

      $('dtitle').onfocus = () => checkpoint();
      $('dtitle').oninput = (e) => { dashTitle = e.target.value; };
      $('dcols').onchange = (e) => { checkpoint(); settings.cols = clamp(e.target.value, 1, 32, 12); applySettings(); renderDashProps(); };
      $('drows').onchange = (e) => { checkpoint(); settings.rows = clamp(e.target.value, 1, 30, 6); applySettings(); };
      $('dcellw').onchange = (e) => { checkpoint(); settings.cellw = clamp(e.target.value, 40, 400, 120); renderDashProps(); };
      $('dcellh').onchange = (e) => { checkpoint(); settings.cellh = clamp(e.target.value, 40, 400, 90); applySettings(); renderDashProps(); };
    }

    // Toetsenbord: ongedaan maken, verwijderen, verplaatsen en breedte wijzigen
    document.addEventListener('keydown', (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      if (['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable) return;
      const key = e.key.toLowerCase();
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && key === 'z') { e.preventDefault(); return undo(); }
      if ((e.ctrlKey || e.metaKey) && (key === 'y' || (e.shiftKey && key === 'z'))) { e.preventDefault(); return redo(); }
      if (currentTab !== 'design' || !selectedId || !props[selectedId]) return;
      if (e.key === 'Escape') return select(null);
      if (e.key === 'Delete') { e.preventDefault(); checkpoint(); return removeTile(selectedId); }
      const dx = { ArrowLeft: -1, ArrowRight: 1 }[e.key] || 0;
      const dy = { ArrowUp: -1, ArrowDown: 1 }[e.key] || 0;
      if (!dx && !dy) return;
      e.preventDefault();
      if (e.shiftKey) {
        const w = clamp(props[selectedId].w + dx, 1, settings.cols, props[selectedId].w);
        if (w !== props[selectedId].w) { checkpoint(); setWidth(w); }
        return;
      }
      const item = tileEl(selectedId);
      if (!item) return;
      checkpoint();
      const n = item.gridstackNode;
      grid.move(item, { x: Math.max(0, n.x + dx), y: Math.max(0, n.y + dy) });
    });

    // ---------- Tabs en resultaat ----------

    function showTab(name) {
      if (currentTab === 'yaml' && name !== 'yaml') {
        try { loadYaml($('yamlbox').value); } catch (e) { return status('YAML-fout: ' + e.message, false); }
      }
      currentTab = name;
      document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === name));
      $('view-design').hidden = name !== 'design';
      $('view-yaml').hidden = name !== 'yaml';
      $('view-result').hidden = name !== 'result';
      $('warn').hidden = !(readOnly && name === 'design');
      if (name === 'yaml') $('yamlbox').value = buildYaml();
      if (name === 'result') showResult();
    }

    function currentDashName() {
      return $('name').value.trim().replace(/\.dash$/, '');
    }

    function showResult() {
      const base = currentDashName();
      if (!base) {
        $('frame').removeAttribute('src');
        $('resinfo').textContent = 'Sla het dashboard eerst op om het resultaat te zien.';
        return;
      }
      const url = `${location.protocol}//${location.hostname}:${appdaemonPort}/${encodeURIComponent(base)}`;
      $('resinfo').innerHTML = `Dashboard: <a href="${url}" target="_blank">${esc(url)}</a> · Compileert AppDaemon het bestand niet automatisch, dan ziet u het oude resultaat.`;
      $('frame').src = url + '?t=' + Date.now();
    }

    // ---------- Data en live waarden ----------

    async function loadSettings() {
      const s = await api('api/settings');
      appdaemonPort = s.appdaemon_port;
    }

    async function loadCatalog() {
      const c = await api('api/catalog');
      TYPES = c.types;
    }

    async function loadEntities() {
      entities = await api('api/entities');
      names = Object.fromEntries(entities.map((e) => [e.entity_id, e.name]));
      renderProps();
    }

    // Elke paar seconden de actuele waarden van de tegels ophalen en de verbindingsstatus tonen
    async function pollLive() {
      const ids = [...new Set(Object.values(props).map((p) => p.entity).filter(Boolean))];
      const r = await api('api/live?ids=' + encodeURIComponent(ids.join(',')));
      live = r.states;
      const wasOnline = haOnline;
      haOnline = r.online;
      $('ha').textContent = r.online ? '● verbonden met Home Assistant' : '● niet verbonden: ' + r.reason;
      $('ha').style.color = r.online ? '#0a7a2f' : '#b00020';
      if (r.online && !wasOnline) await safe(loadEntities);
      document.querySelectorAll('[data-live]').forEach((el) => {
        const s = live[el.dataset.live];
        el.textContent = s ? `${s.state}${s.unit ? ' ' + s.unit : ''}` : '';
      });
    }

    function renderPalette() {
      const pal = $('palette');
      pal.innerHTML = '';
      for (const [k, v] of Object.entries(TYPES)) {
        const b = document.createElement('button');
        b.className = 'pitem';
        b.textContent = v.name;
        b.title = k;
        b.onclick = () => addWidget(k, '', undefined, undefined);
        pal.appendChild(b);
      }
    }

    async function loadList(selected) {
      const items = await api('api/dashboards');
      const sel = $('dashes');
      sel.innerHTML = '<option value="">— kies een dashboard —</option>';
      for (const it of items) {
        const o = document.createElement('option');
        o.value = it.name;
        o.textContent = it.name;
        sel.appendChild(o);
      }
      if (selected) sel.value = selected;
    }

    async function open(name) {
      const d = await api('api/dashboards/' + encodeURIComponent(name));
      $('name').value = name;
      undoStack.length = 0;
      redoStack.length = 0;
      loadYaml(d.content);
      status(readOnly ? 'Geladen (alleen-lezen door include): ' + name : 'Geladen: ' + name, !readOnly);
    }

    async function save() {
      let name = $('name').value.trim();
      if (!name) return status('Vul een naam in', false);
      if (readOnly) return status('Opslaan uitgeschakeld: dit dashboard gebruikt include-verwijzingen', false);
      if (!name.endsWith('.dash')) name += '.dash';
      $('name').value = name;
      if (currentTab === 'yaml') loadYaml($('yamlbox').value);
      await api('api/dashboards/' + encodeURIComponent(name), {
        method: 'PUT',
        headers: { 'Content-Type': 'text/plain' },
        body: buildYaml(),
      });
      await loadList(name);
      status('Opgeslagen: ' + name);
      if (currentTab === 'result') showResult();
    }

    function newDashboard() {
      checkpoint();
      loaded = {};
      dashTitle = '';
      props = {};
      selectedId = null;
      readOnly = false;
      $('warn').hidden = true;
      grid.removeAll();
      $('name').value = '';
      $('dashes').value = '';
      renderProps();
      status('Nieuw dashboard: voeg widgets toe en sla op');
    }

    // ---------- Start ----------

    $('save').onclick = () => safe(save);
    $('new').onclick = newDashboard;
    $('undo').onclick = undo;
    $('redo').onclick = redo;
    $('dashes').onchange = (e) => e.target.value && safe(() => open(e.target.value));
    document.querySelectorAll('.tab').forEach((b) => { b.onclick = () => showTab(b.dataset.tab); });

    initGrid();
    applySettings();
    renderProps();
    setInterval(() => safe(pollLive), 3000);

    (async () => {
      try {
        await Promise.all([loadSettings(), loadCatalog()]);
      } catch (e) {
        status('Catalogus of instellingen niet geladen: ' + e.message, false);
      }
      renderPalette();
      await safe(loadList);
      await safe(loadEntities);
      await safe(pollLive);
    })();
  </script>
</body>
</html>
